<section class="offer__reviews reviews">
  <h2 class="reviews__title">Reviews &middot; <span class="reviews__amount">1</span></h2>
  <ul class="reviews__list">
    @for (comment of comments; track comment.id) {
      <li class="reviews__item">
        <div class="reviews__user user">
          <div class="reviews__avatar-wrapper user__avatar-wrapper">
            <img class="reviews__avatar user__avatar" src="{{comment.user.avatarUrl}}" width="54" height="54"
                 alt="Reviews avatar">
          </div>
          <span class="reviews__user-name">
                       {{ comment.user.name }}
                      </span>
        </div>
        <div class="reviews__info">
          <div class="reviews__rating rating">
            <div class="reviews__stars rating__stars">
              <span [style.width.%]="Math.floor(comment.rating * 20)"></span>
              <span class="visually-hidden">Rating</span>
            </div>
          </div>
          <p class="reviews__text">
            {{ comment.comment }}
          </p>
          <time class="reviews__time"
                [attr.datetime]="comment.date | date: 'YYYY-MM-dd'">{{ comment.date | date: 'MMMM YYYY' }}
          </time>
        </div>
      </li>
    }
  </ul>
  <app-comment-form [offerId]="offerId" (postedComment)="onPostedComment()"/>
</section>
